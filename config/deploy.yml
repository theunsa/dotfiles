# Name of your application. Used to uniquely configure containers.
service: brief

# Name of the container image (use your-user/app-name on external registries).
image: theunsa/brief

# Deploy to these servers.
#
# `opstal`, not `bok`: bok's 80/443 still belong to dokploy-traefik, so no Kamal
# app can run there until Dokploy is removed. opstal is already bootstrapped and
# already runs kamal-proxy. Brief is SQLite-only — it uses none of opstal's
# shared PostgreSQL or Browserless — so all it costs that host is one container
# and one volume. Moving it to bok later is a stop, an rsync of the volume, this
# hostname, and a DNS record.
#
# The name resolves via /etc/hosts (or ~/.ssh/config) to opstal's public address;
# Kamal SSHes in over the public IP, since a laptop is not on pyp1.
servers:
  web:
    hosts:
      - opstal
    options:
      # opstal's real job is the shared PostgreSQL for four applications. A cap
      # keeps a runaway Rails process from evicting its shared_buffers. 768m is
      # comfortable for one Puma worker with Solid Queue in-process; tighter
      # risks an OOM kill during boot.
      memory: 768m

# kamal-proxy terminates TLS with Let's Encrypt and multiplexes this host with
# uptime-kuma and headscale.
#
# The proxy is owned by the infra repo, which booted it. Never run
# `kamal proxy boot` from here — it would reboot the proxy underneath two live
# public services. `kamal deploy` registers with the running one.
#
# The DNS record must be DNS-only (grey cloud) in Cloudflare at least until the
# certificate is issued: with the orange cloud on, the http-01 challenge is
# redirected to HTTPS and the origin has no certificate yet, so it cannot be
# answered. Re-proxying afterwards requires SSL/TLS mode "Full (strict)".
proxy:
  ssl: true
  host: brief.albertec.co.za

# Where you keep your container images.
#
# The package lives in the theunsa ghcr namespace and is created on first push;
# it needs no GitHub repository behind it, and this repo has none.
registry:
  server: ghcr.io
  username: theunsa
  password:
    - KAMAL_REGISTRY_PASSWORD

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  secret:
    # The only secret the application needs. There is no database password:
    # every database here is a SQLite file on the volume below.
    - RAILS_MASTER_KEY
  clear:
    TZ: Africa/Johannesburg

    # One container, one volume, so Solid Queue runs inside Puma. Splitting jobs
    # into their own container the way marula-flow does would give that container
    # its own volume and a second copy of the SQLite files — the split is only
    # safe once the database is not a local file.
    SOLID_QUEUE_IN_PUMA: true

    # One Puma worker. The write load is one author plus a handful of client page
    # views, and a single writer is the friendliest shape for SQLite; the spare
    # cores belong to PostgreSQL.
    WEB_CONCURRENCY: 1

    # The landing page's contact address. Set explicitly because
    # config/initializers/brand.rb falls back to a hello@example.com placeholder.
    # BRAND_NAME and BRAND_TAGLINE default to the right values already.
    BRAND_CONTACT: hi@albertec.co.za

    # Log everything from Rails
    # RAILS_LOG_LEVEL: debug

# Aliases are triggered with "bin/kamal <alias>". You can overwrite arguments on invocation:
# "bin/kamal logs -r job" will tail logs from the first server in the job section.
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"

# All four SQLite databases — primary, cache, queue and cable — plus any local
# Active Storage files live in here. This volume is the entire state of the
# application: lose it and there is nothing else to restore from.
#
# It is deliberately not covered by infra's backup accessories, which dump
# PostgreSQL only. Backups are this repo's own problem (rsync, later).
volumes:
  - "brief_storage:/rails/storage"

# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests. Combines all files from new and old
# version inside the asset_path.
asset_path: /rails/public/assets

# Configure the image builder.
builder:
  arch: amd64
  context: .

  # Built on the laptop and pushed to ghcr, so a deploy costs opstal nothing but
  # a pull. Uncomment to build on opstal instead if the uplink is too slow to
  # push layers — at the cost of a CPU and RAM spike on the database host.
  # remote: ssh://root@opstal
