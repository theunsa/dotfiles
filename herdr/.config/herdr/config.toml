# Herdr is the terminal multiplexer: tmux-style keys plus its agent-aware
# workspace and notification features.
onboarding = false

[theme]
name = "nord"

# Herdr's stock Nord muted tokens use Polar Night shades against a Polar Night
# sidebar, which makes headings, branches, shortcuts, and agent metadata too
# faint. Keep the Nord palette, but use Frost/Snow Storm shades for legibility.
[theme.custom]
overlay0 = "#81a1c1"
overlay1 = "#8fbcbb"
subtext0 = "#d8dee9"

[terminal]
default_shell = "/bin/zsh"
shell_mode = "auto"
new_cwd = "follow"

[update]
channel = "stable"
version_check = true
manifest_check = true

[keys]
prefix = "ctrl+a"

# Tmux muscle memory.
help = "prefix+?"
detach = ["prefix+d", "prefix+q"]
reload_config = "prefix+r"
new_tab = ["prefix+c", "prefix+shift+c"]
# Zero-based tab jumps live in the [[keys.command]] entries below; Herdr's
# indexed bindings only accept 1..9, so the built-in action is disabled.
switch_tab = ""
close_tab = "prefix+shift+x"
copy_mode = "prefix+["
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
split_vertical = ["prefix+\\", "ctrl+\\"]
split_horizontal = "prefix+minus"
close_pane = "prefix+x"
zoom = "prefix+z"
resize_mode = "prefix+shift+r"

# Typecraft's leader+g agent/workspace finder, with leader+s as an
# alias. Leader+b collapses or fully hides the agent sidebar.
goto = ["prefix+g", "prefix+s"]
workspace_picker = "prefix+w"
toggle_sidebar = "prefix+b"

# Uppercase H/J/K/L resize panes (tmux muscle memory), so disable Herdr's
# default swap actions on those keys before assigning the commands below.
swap_pane_left = ""
swap_pane_down = ""
swap_pane_up = ""
swap_pane_right = ""

# Ctrl-H/J/K/L moves through Neovim splits first,
# then crosses the edge into the adjacent Herdr pane. In non-Vim panes the
# same keys focus Herdr panes directly.
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (Neovim/Herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (Neovim/Herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (Neovim/Herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (Neovim/Herdr)"

[[keys.command]]
key = "prefix+shift+h"
type = "shell"
command = '"$HERDR_BIN_PATH" pane resize --current --direction left --amount 5'
description = "resize pane left"

[[keys.command]]
key = "prefix+shift+j"
type = "shell"
command = '"$HERDR_BIN_PATH" pane resize --current --direction down --amount 5'
description = "resize pane down"

[[keys.command]]
key = "prefix+shift+k"
type = "shell"
command = '"$HERDR_BIN_PATH" pane resize --current --direction up --amount 5'
description = "resize pane up"

[[keys.command]]
key = "prefix+shift+l"
type = "shell"
command = '"$HERDR_BIN_PATH" pane resize --current --direction right --amount 5'
description = "resize pane right"

# Prefix+0..9 jumps to the tab at that zero-based position in the active
# workspace (0 is the first tab), like tmux with base-index 0.
[[keys.command]]
key = "prefix+0"
type = "shell"
command = '''id=$("$HERDR_BIN_PATH" tab list --workspace "$HERDR_ACTIVE_WORKSPACE_ID" | grep -o '"tab_id":"[^"]*"' | sed -n '1p' | cut -d'"' -f4); [ -n "$id" ] && "$HERDR_BIN_PATH" tab focus "$id"'''
description = "switch to tab 0"

[[keys.command]]
key = "prefix+1"
type = "shell"
command = '''id=$("$HERDR_BIN_PATH" tab list --workspace "$HERDR_ACTIVE_WORKSPACE_ID" | grep -o '"tab_id":"[^"]*"' | sed -n '2p' | cut -d'"' -f4); [ -n "$id" ] && "$HERDR_BIN_PATH" tab focus "$id"'''
description = "switch to tab 1"

