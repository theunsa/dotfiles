key = "prefix+2"
type = "shell"
command = '''id=$("$HERDR_BIN_PATH" tab list --workspace "$HERDR_ACTIVE_WORKSPACE_ID" | grep -o '"tab_id":"[^"]*"' | sed -n '3p' | cut -d'"' -f4); [ -n "$id" ] && "$HERDR_BIN_PATH" tab focus "$id"'''
description = "switch to tab 2"

[[keys.command]]
key = "prefix+3"
type = "shell"
command = '''id=$("$HERDR_BIN_PATH" tab list --workspace "$HERDR_ACTIVE_WORKSPACE_ID" | grep -o '"tab_id":"[^"]*"' | sed -n '4p' | cut -d'"' -f4); [ -n "$id" ] && "$HERDR_BIN_PATH" tab focus "$id"'''
